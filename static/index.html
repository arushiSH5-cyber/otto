<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otto</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="day">
<!-- Otto's watercolor world: follows the real time of day, rains in Storm Mode -->
<div class="world" aria-hidden="true">
  <!-- watercolor washes on paper -->
  <div class="wash w1"></div><div class="wash w2"></div><div class="wash w3"></div><div class="wash w4"></div><div class="wash w5"></div>
  <div class="paper-grain"></div>
  <div class="stars"></div><div class="moon"></div>
  <!-- cloud friends: they smile by day, sleep at night, and get sad in a storm -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="kcloud" viewBox="0 0 200 110">
        <path d="M30 96 C6 96 4 66 26 60 C20 34 52 22 70 36 C78 10 122 6 132 34 C150 22 180 32 176 58 C198 62 196 96 172 96 Z" fill="currentColor" stroke="#7d6f9e" stroke-width="3" stroke-linejoin="round"/>
        <g class="kc-day"><circle cx="82" cy="66" r="4" fill="#4a3f5c"/><circle cx="118" cy="66" r="4" fill="#4a3f5c"/><path d="M92 74 q8 8 16 0" stroke="#4a3f5c" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <g class="kc-night"><path d="M76 66 q6 5 12 0 M112 66 q6 5 12 0" stroke="#4a3f5c" stroke-width="3" fill="none" stroke-linecap="round"/><text x="140" y="44" font-size="16" fill="#7d6f9e" font-family="ui-rounded">z</text><text x="152" y="30" font-size="12" fill="#7d6f9e" font-family="ui-rounded">z</text></g>
        <g class="kc-storm"><circle cx="82" cy="66" r="4" fill="#4a3f5c"/><circle cx="118" cy="66" r="4" fill="#4a3f5c"/><path d="M92 80 q8 -7 16 0" stroke="#4a3f5c" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M122 72 q-3 7 0 9 q3 -2 0 -9Z" fill="#8fb6e8"/></g>
        <ellipse cx="70" cy="76" rx="7" ry="4" fill="#f5a3b4" opacity=".7"/><ellipse cx="130" cy="76" rx="7" ry="4" fill="#f5a3b4" opacity=".7"/>
      </symbol>
    </defs>
  </svg>
  <svg class="kc k1"><use href="#kcloud"/></svg>
  <svg class="kc k2"><use href="#kcloud"/></svg>
  <svg class="kc k3"><use href="#kcloud"/></svg>
  <svg class="kc k4"><use href="#kcloud"/></svg>
  <div class="doodles"><i>✦</i><i>✧</i><i>✦</i><i>○</i><i>◦</i><i>✧</i><i>ℓℓℓ</i><i>○</i><i>✦</i><i>◦</i></div>
  <div class="rain"></div><div class="flash"></div>
</div>

<header class="top">
  <div id="badge" class="badge" title="Counts every request that leaves this device">📶 Wi-Fi on · 0 bytes sent</div>
  <div class="clock"><div id="day" class="day-name"></div><div id="time" class="time"></div></div>
  <div class="right">
    <select id="lang" aria-label="Language">
      <option value="en">English</option><option value="es">Español</option><option value="hi">हिन्दी</option>
      <option value="zh">中文</option><option value="vi">Tiếng Việt</option><option value="tl">Tagalog</option>
    </select>
    <button id="gear" class="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm7.4-2.5a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 2.8h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5-2.2-1.6Z"/></svg></button>
  </div>
</header>

<main>
  <section class="stage">
    <div class="perch">
      <div id="hearts" class="hearts"></div>
      <svg id="owl" class="owl" viewBox="-40 -50 280 270" aria-label="Otto the owl" role="img">
        <g class="owl-body">
          <path d="M52 52 L40 18 L74 40 Z" class="tuft"/><path d="M148 52 L160 18 L126 40 Z" class="tuft"/>
          <ellipse cx="100" cy="112" rx="72" ry="80" class="plum"/>
          <ellipse cx="100" cy="135" rx="48" ry="52" class="belly"/>
          <path d="M80 130 q6 6 12 0 M100 130 q6 6 12 0 M90 148 q6 6 12 0 M78 164 q6 6 12 0 M102 164 q6 6 12 0" class="chev"/>
          <path class="wing wing-l" d="M32 100 q-14 40 12 72 q8 -36 -12 -72 Z"/>
          <path class="wing wing-r" d="M168 100 q14 40 -12 72 q-8 -36 12 -72 Z"/>
          <circle cx="72" cy="80" r="30" class="disc"/><circle cx="128" cy="80" r="30" class="disc"/>
          <g class="eyes"><g id="look">
            <circle cx="72" cy="80" r="18" class="pupil"/><circle cx="128" cy="80" r="18" class="pupil"/>
            <circle cx="78" cy="73" r="6" fill="#fff"/><circle cx="134" cy="73" r="6" fill="#fff"/>
            <circle cx="67" cy="86" r="2.5" fill="#fff"/><circle cx="123" cy="86" r="2.5" fill="#fff"/>
          </g></g>
          <g class="happy-eyes"><path d="M58 84 q14 -18 28 0 M114 84 q14 -18 28 0"/></g>
          <g class="lids"><rect x="50" y="58" width="44" height="44" rx="22" class="disc"/><rect x="106" y="58" width="44" height="44" rx="22" class="disc"/></g>
          <g class="brows"><path d="M54 52 L88 60"/><path d="M146 52 L112 60"/></g>
          <ellipse cx="54" cy="106" rx="8" ry="5" class="blush"/><ellipse cx="146" cy="106" rx="8" ry="5" class="blush"/>
          <path class="beak-top" d="M90 100 L110 100 L100 114 Z"/>
          <path class="beak-low" d="M93 108 L107 108 L100 118 Z"/>
          <path d="M78 190 l-6 10 M84 191 l0 11 M90 190 l6 10 M110 190 l-6 10 M116 191 l0 11 M122 190 l6 10" class="feet"/>
          <!-- detective hat + magnifier (Scam Check) -->
          <g class="acc detective">
            <path d="M44 40 Q100 -30 156 40 Z" fill="#7b5a3a"/><path d="M30 42 Q100 18 170 42 Q100 56 30 42Z" fill="#5c4129"/>
            <path d="M60 30 Q100 6 140 30" stroke="#c9a46a" stroke-width="5" fill="none"/>
            <g class="glass"><circle cx="196" cy="118" r="22" fill="rgba(200,230,255,.45)" stroke="#3b3b3b" stroke-width="7"/><path d="M180 136 L160 166" stroke="#3b3b3b" stroke-width="9" stroke-linecap="round"/></g>
          </g>
          <!-- lantern (Storm Mode) -->
          <g class="acc lantern">
            <circle cx="0" cy="150" r="34" class="glow"/>
            <path d="M0 104 v12" stroke="#333" stroke-width="3"/><rect x="-14" y="116" width="28" height="6" rx="2" fill="#333"/>
            <rect x="-12" y="122" width="24" height="34" rx="6" fill="#ffd36e" stroke="#333" stroke-width="3"/>
            <path d="M0 132 q-5 8 0 14 q5 -6 0 -14Z" fill="#ff8c2b" class="flame"/>
            <rect x="-14" y="156" width="28" height="6" rx="2" fill="#333"/>
          </g>
          <!-- sound waves (listening) -->
          <g class="acc waves"><path d="M184 60 q14 14 0 28 M196 50 q24 24 0 48"/></g>
          <!-- heart (happy) -->
          <g class="acc heart"><path d="M100 -28 c-6 -12 -24 -8 -20 6 c3 10 20 18 20 18 s17 -8 20 -18 c4 -14 -14 -18 -20 -6Z" fill="#ef6f6c"/></g>
        </g>
      </svg>
      <svg class="branch" viewBox="0 0 400 40" aria-hidden="true"><path d="M0 22 C80 14 160 30 260 20 S360 12 400 18 L400 30 C330 26 260 38 160 34 S40 30 0 34Z"/><path d="M300 18 q14 -20 34 -16 q-14 4 -20 18Z" class="leaf"/><path d="M70 22 q-10 -18 -30 -18 q12 6 16 20Z" class="leaf"/></svg>
    </div>
    <div class="note">
      <div id="bubble" class="bubble" aria-live="polite"></div>
      <div id="meta" class="meta"></div>
    </div>
    <button id="mic" class="mic"><span class="mic-ring"></span><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1a7 7 0 0 0 6-6.9h-2Z"/></svg><span id="micLabel" data-t="mic">Tap and talk</span></button>
  </section>

  <nav id="home" class="home">
    <button class="tile t-talk" data-go="talk"><svg viewBox="0 0 48 48"><path d="M8 10h32a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H22l-9 8v-8H8a4 4 0 0 1-4-4V14a4 4 0 0 1 4-4Z"/><circle cx="16" cy="22" r="2.5" class="dot"/><circle cx="24" cy="22" r="2.5" class="dot"/><circle cx="32" cy="22" r="2.5" class="dot"/></svg><b data-t="talk">Talk to Otto</b><small data-t="sub_talk"></small></button>
    <button class="tile t-scam" data-go="scam"><svg viewBox="0 0 48 48"><circle cx="20" cy="20" r="12"/><path d="M29 29l12 12" class="stroke"/><path d="M15 20h10" class="stroke dot"/></svg><b data-t="scam">Is this a scam?</b><small data-t="sub_scam"></small></button>
    <button class="tile t-storm" data-go="storm"><svg viewBox="0 0 48 48"><path d="M14 30a9 9 0 1 1 3-17.5A11 11 0 0 1 38 16a7 7 0 0 1-2 14Z"/><path d="M24 30l-4 8h6l-3 7" class="stroke dot"/></svg><b data-t="storm">Storm Mode</b><small data-t="sub_storm"></small></button>
    <button class="tile t-mem" data-go="memories"><svg viewBox="0 0 48 48"><path d="M6 10c6-3 12-3 18 1v29c-6-4-12-4-18-1Z"/><path d="M42 10c-6-3-12-3-18 1v29c6-4 12-4 18-1Z"/><path d="M33 18c-2-3-6-1-4 2l4 4 4-4c2-3-2-5-4-2Z" class="dot"/></svg><b data-t="memories">Memories</b><small data-t="sub_memories"></small></button>
  </nav>

  <!-- TALK -->
  <section id="p-talk" class="panel" hidden>
    <div class="quick" id="quick"></div>
    <form id="talkForm" class="row">
      <input id="talkIn" autocomplete="off" data-ph="type">
      <button class="go" data-t="send">Send</button>
    </form>
    <div class="pair">
      <button class="wide-btn sage" id="laneBtn">🌳 <span data-t="lane">Memory Lane</span></button>
      <label class="wide-btn sun-btn">🖼️ <span data-t="photo_mem">Show me an old photo</span><input id="photoFile" type="file" accept="image/*" hidden></label>
    </div>
    <div id="lanePhoto" class="polaroid small" hidden><img alt=""></div>
    <form id="laneForm" class="col" hidden>
      <textarea id="laneIn" rows="3" data-ph="answer"></textarea>
      <button class="go" data-t="save">Save my memory</button>
    </form>
    <button class="back" data-t="back">← Back</button>
  </section>

  <!-- SCAM -->
  <section id="p-scam" class="panel" hidden>
    <label class="wide-btn coral file">📷 <span data-t="photo">Take or choose a photo</span>
      <input id="scamFile" type="file" accept="image/*" capture="environment" hidden>
    </label>
    <img id="scamImg" class="preview" hidden alt="">
    <textarea id="scamText" rows="3" data-ph="paste"></textarea>
    <button class="go wide" id="scamGo" data-t="check">Check it</button>
    <div id="verdict" class="verdict" hidden></div>
    <button class="back" data-t="back">← Back</button>
  </section>

  <!-- STORM -->
  <section id="p-storm" class="panel" hidden>
    <div id="battery" class="battery" hidden></div>
    <ol id="steps" class="steps"></ol>
    <button class="go wide" id="stepNext" data-t="next">Next</button>
    <div id="checkStatus" class="status"></div>
    <button class="back" id="stormStop" data-t="stop">← Stop Storm Mode</button>
  </section>

  <!-- MEMORIES -->
  <section id="p-memories" class="panel" hidden>
    <div class="book-head"><h2 id="bookTitle"></h2><button class="go" id="printBtn">🖨️ <span data-t="print">Print</span></button></div>
    <div id="book" class="book"></div>
    <button class="back" data-t="back">← Back</button>
  </section>

  <!-- SETTINGS -->
  <section id="p-settings" class="panel paper" hidden>
    <h2 data-t="settings">Settings</h2>
    <label>Name <input id="s-name"></label>
    <label>Medical note (shown on the help card) <input id="s-medical"></label>
    <label>Family relation <input id="s-contact_relation"></label>
    <label>Family name <input id="s-contact_name"></label>
    <label>Family phone <input id="s-contact_phone"></label>
    <label class="check"><input type="checkbox" id="s-demo"> Demo mode (check-in every 60 s, alarm after 15 s)</label>
    <button class="go wide" id="saveSettings" data-t="save">Save</button>
    <p class="fine">Otto is not a replacement for 911. Everything stays on this device, in <code>data/</code>.</p>
    <button class="back" data-t="back">← Back</button>
  </section>
</main>

<!-- Otto noticed something (Wi-Fi off / power out) -->
<div id="notice" class="overlay soft" hidden>
  <div class="card paper">
    <p id="noticeText" class="notice-text"></p>
    <div class="pair">
      <button class="go big-go" id="noticeStorm" data-t="yes_storm">Yes, Storm Mode</button>
      <button class="back" id="noticeFine" data-t="im_fine">I'm fine</button>
    </div>
  </div>
</div>

<!-- CHECK-IN -->
<div id="checkin" class="overlay" hidden>
  <div class="card paper">
    <p class="huge" data-t="areyouok">Are you OK?</p>
    <button class="ok" data-ok>✅ <span data-t="imok">I'm OK</span></button>
    <p id="countdown" class="countdown"></p>
  </div>
</div>

<!-- ALARM -->
<div id="alarm" class="overlay alarm" hidden>
  <div class="card help">
    <p class="huge">🆘 I NEED HELP</p>
    <p class="help-line">Please call <b>911</b></p>
    <p class="help-line" id="a-name"></p>
    <p class="help-line" id="a-medical"></p>
    <p class="help-line" id="a-contact"></p>
    <button class="ok" data-ok>✅ <span data-t="imok">I'm OK</span></button>
  </div>
</div>

<footer class="foot" data-t="foot">Otto never gives medicine doses. In an emergency, call 911.</footer>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, sans-serif">
  <style>
    .flow { stroke-dasharray: 10 10; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 50% { transform: scale(1.06); } }
    .nope { animation: nope 2.4s ease-in-out infinite; }
    @keyframes nope { 50% { opacity: .45; } }
    .t { font-weight: 800; fill: #4a3f5c; } .s { font-weight: 700; fill: #7a6e8c; }
  </style>
  <defs><filter id="wc" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="30"/></filter></defs>
  <rect width="1280" height="560" rx="36" fill="#fdf8f2"/>
  <g filter="url(#wc)" opacity=".75"><ellipse cx="200" cy="500" rx="300" ry="150" fill="#c9def7"/><ellipse cx="1150" cy="80" rx="260" ry="160" fill="#cdeedd"/><ellipse cx="660" cy="100" rx="300" ry="120" fill="#fbd3c1"/></g>

  <text x="640" y="58" text-anchor="middle" font-size="34" class="t">How Otto works with the Wi-Fi off</text>

  <!-- the house -->
  <path d="M80 160 L560 100 L1040 160" fill="none" stroke="#7d6f9e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="80" y="160" width="960" height="370" rx="26" fill="#fffaf3" fill-opacity=".7" stroke="#7d6f9e" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <text x="104" y="198" font-size="20" class="s">🏠 Grandma's house · one laptop (or the Qualcomm iQ9)</text>

  <!-- 3D block helper: top face, side face, front face -->
  <!-- browser -->
  <g class="pulse">
    <path d="M120 250 l16 -16 h200 l-16 16z" fill="#fbe0c9" stroke="#7d6f9e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M320 250 l16 -16 v130 l-16 16z" fill="#e9b98f" stroke="#7d6f9e" stroke-width="3" stroke-linejoin="round"/>
    <rect x="120" y="250" width="200" height="130" rx="6" fill="#fde3c4" stroke="#7d6f9e" stroke-width="3"/>
    <text x="220" y="292" text-anchor="middle" font-size="26">🦉🎙️📷</text>
    <text x="220" y="328" text-anchor="middle" font-size="21" class="t">Otto's screen</text>
    <text x="220" y="354" text-anchor="middle" font-size="15" class="s">voice · photos · taps</text>
  </g>

  <!-- server -->
  <path d="M400 250 l16 -16 h200 l-16 16z" fill="#efe2f8" stroke="#7d6f9e" stroke-width="3" stroke-linejoin="round"/>
  <path d="M600 250 l16 -16 v130 l-16 16z" fill="#cdb7e6" stroke="#7d6f9e" stroke-width="3" stroke-linejoin="round"/>
  <rect x="400" y="250" width="200" height="130" rx="6" fill="#e6d2f2" stroke="#7d6f9e" stroke-width="3"/>
  <text x="500" y="292" text-anchor="middle" font-size="26">🛡️</text>
  <text x="500" y="328" text-anchor="middle" font-size="21" class="t">server.py</text>
  <text x="500" y="354" text-anchor="middle" font-size="15" class="s">safety rules · scam rules</text>

  <!-- models -->
  <g font-size="18">
    <path d="M700 206 l14 -14 h290 l-14 14z" fill="#fbe6ee" stroke="#7d6f9e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M990 206 l14 -14 v74 l-14 14z" fill="#e8b4c4" stroke="#7d6f9e" stroke-width="3" stroke-linejoin="round"/>
    <rect x="700" y="206" width="290" height="74" rx="6" fill="#fbd3df" stroke="#7d6f9e" stroke-width="3"/>
    <text x="845" y="238" text-anchor="middle" class="t">💬 LFM3-1.7B</text><text x="845" y="263" text-anchor="middle" font-size="14" class="s">talk · memories · translate</text>

    <path d="M700 316 l14 -14 h290 l-14 14z" fill="#eef2fd" stroke="#7d6f9e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M990 316 l14 -14 v74 l-14 14z" fill="#b7c6ea" stroke="#7d6f9e" stroke-width="3" stroke-linejoin="round"/>
    <rect x="700" y="316" width="290" height="74" rx="6" fill="#dfe6fb" stroke="#7d6f9e" stroke-width="3"/>
    <text x="845" y="348" text-anchor="middle" class="t">👀 LFM3-VL-2B</text><text x="845" y="373" text-anchor="middle" font-size="14" class="s">scam letters · old photos</text>

    <path d="M700 426 l14 -14 h290 l-14 14z" fill="#ecf8f1" stroke="#7d6f9e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M990 426 l14 -14 v74 l-14 14z" fill="#9fcfb7" stroke="#7d6f9e" stroke-width="3" stroke-linejoin="round"/>
    <rect x="700" y="426" width="290" height="74" rx="6" fill="#c9ecd9" stroke="#7d6f9e" stroke-width="3"/>
    <text x="845" y="458" text-anchor="middle" class="t">👂 LFM3-Audio-2B</text><text x="845" y="483" text-anchor="middle" font-size="14" class="s">her voice → text, 6 languages</text>
  </g>

  <!-- local arrows -->
  <g fill="none" stroke="#8f80c4" stroke-width="5" stroke-linecap="round">
    <path class="flow" d="M336 315 H392"/>
    <path class="flow" d="M616 300 C660 300 660 243 694 243"/>
    <path class="flow" d="M616 315 H694"/>
    <path class="flow" d="M616 330 C660 330 660 463 694 463"/>
  </g>
  <text x="655" y="410" text-anchor="middle" font-size="14" class="s" transform="rotate(-90 655 410)">localhost only</text>
  <text x="160" y="430" font-size="15" class="s">💾 memories, photos, settings</text>
  <text x="160" y="452" font-size="15" class="s">stay in data/ on this device</text>

  <!-- the internet, cut off -->
  <g class="nope">
    <path d="M1112 300 C1090 300 1088 274 1108 270 C1104 248 1130 238 1144 250 C1152 228 1190 226 1198 250 C1214 240 1240 250 1236 272 C1256 276 1254 300 1232 300 Z" fill="#eef0f5" stroke="#9aa3b5" stroke-width="3"/>
    <text x="1172" y="290" text-anchor="middle" font-size="18" font-weight="800" fill="#9aa3b5">cloud</text>
  </g>
  <path d="M1040 300 H1100" stroke="#e0566b" stroke-width="5" stroke-dasharray="6 8" stroke-linecap="round"/>
  <g stroke="#e0566b" stroke-width="7" stroke-linecap="round"><path d="M1056 284 L1084 316"/><path d="M1084 284 L1056 316"/></g>
  <rect x="1078" y="330" width="188" height="64" rx="18" fill="#5fb48a" stroke="#3f8a66" stroke-width="3"/>
  <text x="1172" y="358" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">📴 0 bytes sent</text>
  <text x="1172" y="382" text-anchor="middle" font-size="13" font-weight="700" fill="#e9fff3">counted, not promised</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', 'Varela Round', system-ui, sans-serif">
  <style>
    .bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 300px 330px; }
    .blink { animation: blink 4.5s infinite; transform-origin: center; transform-box: fill-box; transform: scaleY(0); }
    .float { animation: float 4s ease-in-out infinite; }
    .f2 { animation-delay: -1.5s; } .f3 { animation-delay: -2.6s; }
    .drift { animation: drift 30s linear infinite; } .d2 { animation-duration: 42s; animation-delay: -20s; } .d3 { animation-duration: 36s; animation-delay: -8s; }
    .tw { animation: tw 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .t2 { animation-delay: -.8s; } .t3 { animation-delay: -1.6s; }
    .title { animation: title 5s ease-in-out infinite; transform-origin: 830px 210px; }
    .heart { animation: heart 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes bob { 50% { transform: translateY(-8px) rotate(-1.5deg); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(0); } 96% { transform: scaleY(1); } }
    @keyframes float { 50% { transform: translateY(-10px); } }
    @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1400px); } }
    @keyframes tw { 50% { opacity: .25; transform: scale(.7) rotate(25deg); } }
    @keyframes title { 50% { transform: translateY(-6px) rotate(-1deg); } }
    @keyframes heart { 0%, 100% { transform: translateY(0) scale(1); opacity: 1; } 60% { transform: translateY(-26px) scale(1.15); opacity: .2; } }
  </style>
  <defs>
    <filter id="wc" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .45 0 0 0 0 .4 0 0 0 .08 0"/></filter>
    <symbol id="cl" viewBox="0 0 200 110">
      <path d="M30 96 C6 96 4 66 26 60 C20 34 52 22 70 36 C78 10 122 6 132 34 C150 22 180 32 176 58 C198 62 196 96 172 96 Z" fill="currentColor" stroke="#7d6f9e" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="82" cy="66" r="4" fill="#4a3f5c"/><circle cx="118" cy="66" r="4" fill="#4a3f5c"/>
      <path d="M92 74 q8 8 16 0" stroke="#4a3f5c" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="70" cy="76" rx="7" ry="4" fill="#f5a3b4" opacity=".7"/><ellipse cx="130" cy="76" rx="7" ry="4" fill="#f5a3b4" opacity=".7"/>
    </symbol>
    <clipPath id="card"><rect width="1280" height="440" rx="36"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="#fdf8f2"/>
    <g filter="url(#wc)" opacity=".9">
      <ellipse cx="120" cy="60" rx="300" ry="200" fill="#fbd3c1"/>
      <ellipse cx="1180" cy="40" rx="280" ry="190" fill="#cdeedd"/>
      <ellipse cx="640" cy="420" rx="330" ry="150" fill="#e6d2f2"/>
      <ellipse cx="1180" cy="430" rx="260" ry="170" fill="#fbe7b5"/>
      <ellipse cx="60" cy="440" rx="260" ry="170" fill="#c9def7"/>
    </g>
    <rect width="1280" height="440" filter="url(#grain)"/>

    <!-- cloud friends drifting -->
    <g class="drift"><use href="#cl" x="0" y="40" width="130" height="72" color="#e3d4f5"/></g>
    <g class="drift d2"><use href="#cl" x="0" y="300" width="110" height="60" color="#cfe3f8"/></g>
    <g class="drift d3"><use href="#cl" x="0" y="150" width="90" height="50" color="#f9d8e2"/></g>

    <!-- sparkles -->
    <g fill="#c3a6ea"><path class="tw" d="M560 60 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/><path class="tw t2" d="M1210 200 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" fill="#f4a7b9"/>
    <path class="tw t3" d="M470 360 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#9fc2ea"/><path class="tw" d="M90 230 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#f9c98f"/></g>
    <g fill="none" stroke="#b6a6d6" stroke-width="2.5"><circle class="tw t2" cx="1120" cy="120" r="9"/><circle class="tw" cx="1140" cy="104" r="5"/><circle class="tw t3" cx="520" cy="300" r="7"/></g>

    <!-- Otto on his branch -->
    <path d="M110 342 C190 332 280 352 380 340 S470 332 500 338 L500 352 C440 350 380 362 280 358 S160 354 110 358Z" fill="#b48a6a" stroke="#5a4436" stroke-width="3"/>
    <path d="M430 338 q14 -22 36 -18 q-16 4 -22 20Z" fill="#a8dcc4" stroke="#5a4436" stroke-width="2.5"/>
    <g class="bob" transform="translate(200 120)">
      <g transform="scale(1.05)" stroke="#5a4436" stroke-width="3.5" stroke-linejoin="round">
        <path d="M52 52 L40 18 L74 40 Z" fill="#a97c5d"/><path d="M148 52 L160 18 L126 40 Z" fill="#a97c5d"/>
        <ellipse cx="100" cy="112" rx="72" ry="80" fill="#c99d7c"/>
        <ellipse cx="100" cy="135" rx="48" ry="52" fill="#fbebd3"/>
        <path d="M80 130 q6 6 12 0 M100 130 q6 6 12 0 M90 148 q6 6 12 0 M78 164 q6 6 12 0 M102 164 q6 6 12 0" stroke="#e2c597" stroke-width="3" fill="none"/>
        <path d="M32 100 q-14 40 12 72 q8 -36 -12 -72 Z" fill="#a97c5d"/><path d="M168 100 q14 40 -12 72 q-8 -36 12 -72 Z" fill="#a97c5d"/>
        <circle cx="72" cy="80" r="30" fill="#fff6ea"/><circle cx="128" cy="80" r="30" fill="#fff6ea"/>
        <g stroke="none"><circle cx="72" cy="80" r="18" fill="#2b2118"/><circle cx="128" cy="80" r="18" fill="#2b2118"/>
        <circle cx="78" cy="73" r="6" fill="#fff"/><circle cx="134" cy="73" r="6" fill="#fff"/><circle cx="67" cy="86" r="2.5" fill="#fff"/><circle cx="123" cy="86" r="2.5" fill="#fff"/>
        <ellipse cx="54" cy="106" rx="8" ry="5" fill="#f6a0b4"/><ellipse cx="146" cy="106" rx="8" ry="5" fill="#f6a0b4"/>
        <path d="M90 100 L110 100 L100 114 Z" fill="#f2a33a"/><path d="M93 108 L107 108 L100 118 Z" fill="#d9822b"/></g>
        <g class="blink" stroke="#5a4436"><rect x="50" y="58" width="44" height="44" rx="22" fill="#fff6ea"/><rect x="106" y="58" width="44" height="44" rx="22" fill="#fff6ea"/></g>
        <path d="M78 190 l-6 10 M84 191 l0 11 M90 190 l6 10 M110 190 l-6 10 M116 191 l0 11 M122 190 l6 10" stroke="#f2a33a" stroke-width="5" stroke-linecap="round"/>
      </g>
      <path class="heart" d="M190 10 c-5 -10 -20 -7 -17 5 c3 9 17 15 17 15 s14 -6 17 -15 c3 -12 -12 -15 -17 -5Z" fill="#f4a7b9" stroke="#7d6f9e" stroke-width="2"/>
    </g>

    <!-- 3D title: stacked layers make it pop out of the page -->
    <g class="title" font-weight="900" font-size="150" text-anchor="middle">
      <text x="842" y="232" fill="#4a3f5c">Otto</text>
      <text x="839" y="229" fill="#5b4e72">Otto</text>
      <text x="836" y="226" fill="#6b5e86">Otto</text>
      <text x="833" y="223" fill="#7d6f9e">Otto</text>
      <text x="830" y="220" fill="#fffaf3" stroke="#4a3f5c" stroke-width="4" paint-order="stroke">Otto</text>
    </g>
    <text x="830" y="282" text-anchor="middle" font-size="30" font-weight="800" fill="#4a3f5c">an offline owl friend for grandparents</text>

    <!-- pills -->
    <g font-size="19" font-weight="800" text-anchor="middle">
      <g class="float"><rect x="560" y="316" width="168" height="46" rx="23" fill="#fde3c4" stroke="#7d6f9e" stroke-width="3"/><text x="644" y="346" fill="#4a3f5c">🗣️ talks</text></g>
      <g class="float f2"><rect x="742" y="316" width="176" height="46" rx="23" fill="#fbd3df" stroke="#7d6f9e" stroke-width="3"/><text x="830" y="346" fill="#4a3f5c">🔍 spots scams</text></g>
      <g class="float f3"><rect x="932" y="316" width="196" height="46" rx="23" fill="#dfe6fb" stroke="#7d6f9e" stroke-width="3"/><text x="1030" y="346" fill="#4a3f5c">⛈️ watches over</text></g>
    </g>
    <text x="844" y="398" text-anchor="middle" font-size="18" font-weight="700" fill="#7a6e8c">📴 100% on-device · Liquid AI LFM3 text + vision + audio · 0 bytes leave the house</text>
  </g>
  <rect x="1.5" y="1.5" width="1277" height="437" rx="35" fill="none" stroke="#7d6f9e" stroke-width="3"/>
</svg>
